spring:
  application:
    name: event-based-chat
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:chat}
    username: ${DB_APP_USER:chat_app}
    password: ${DB_APP_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 1500
  flyway:
    user: ${DB_OWNER_USER:chat_owner}
    password: ${DB_OWNER_PASSWORD}
    placeholders:
      appUser: ${DB_APP_USER:chat_app}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      username: ${REDIS_USER:chat-app}
      password: ${REDIS_PASSWORD}
      timeout: 500ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}
    # 브로커가 없을 때 relay가 DB 트랜잭션을 오래 쥐지 않도록 짧게 실패한다.
    producer:
      properties:
        max.block.ms: 2000
        request.timeout.ms: 3000
        delivery.timeout.ms: 5000
    consumer:
      auto-offset-reset: earliest
    # 발행(outbox relay)과 소비(SnapshotWorker)를 추적에 잇는다.
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
  mvc:
    problemdetails:
      enabled: true

logging:
  structured:
    ecs:
      service:
        node-name: ${HOSTNAME:local}

server:
  shutdown: graceful
  forward-headers-strategy: native
  tomcat:
    max-connections: 5000
    accept-count: 1000

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState
  # 추적은 항상 만들고(로컬 샘플링 1.0), 내보내기는 OTEL_ENABLED=true(obs 프로필)일 때만 한다.
  tracing:
    sampling:
      probability: 1.0
    export:
      otlp:
        enabled: ${OTEL_ENABLED:false}
  opentelemetry:
    resource-attributes:
      service.instance.id: ${HOSTNAME:local}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_ENDPOINT:http://localhost:4318}/v1/traces
  otlp:
    metrics:
      export:
        enabled: ${OTEL_ENABLED:false}
        url: ${OTEL_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 15s
    logging:
      export:
        enabled: false

chat:
  message:
    max-length: 2000
  write:
    max-concurrent-per-node: 6
  read-path:
    max-concurrent-per-node: 3
  restore:
    timeout: 5s
    default-item-limit: 50
    max-item-limit: 200
    future-tolerance: 60s
  outbox:
    poll-interval: 1s
  ingest:
    typing-ttl: 10s
    typing-min-store-interval: 3s
    read-min-store-interval: 1s
  stomp:
    server-heartbeat: 10s
    client-heartbeat: 5s
    max-heartbeat: 10s
    max-connections-per-user-per-node: 5
    message-size-limit: 64KB
    send-buffer-size-limit: 512KB
    send-time-limit: 10s
    time-to-first-message: 10s
    resume-max-events: 200
    resume-max-bytes: 256KB
    resume-max-concurrent: 3
    inbound-concurrency: 64
    drain-window: 10s
    allowed-origins: http://localhost:*,http://127.0.0.1:*
  realtime:
    health-check-interval: 5s
    degraded-poll-interval: 5s
  presence:
    grace: 15s
    node-heartbeat: 5s
    node-lease-ttl: 15s
    sweep-interval: 2s
    reconcile-interval: 60s
  jwt:
    issuer: event-based-chat
    access-ttl: 30m
    clock-skew: 30s
    secret: ${JWT_SECRET}
  refresh-token:
    ttl: 14d
    cleanup-after: 30d
  # logback-spring.xml에서 쓴다. 파일 이름에는 호스트명이 붙는다(logs/app-{host}.log, logs/audit-{host}.log).
  logging:
    dir: logs
    app:
      max-file-size: 50MB
      max-history: 7
      total-size-cap: 1GB
    audit:
      max-file-size: 50MB
      max-history: 30
      total-size-cap: 500MB
