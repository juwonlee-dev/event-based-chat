spring:
  application:
    name: event-based-chat
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:chat}
    username: ${DB_APP_USER:chat_app}
    password: ${DB_APP_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 1500
  flyway:
    user: ${DB_OWNER_USER:chat_owner}
    password: ${DB_OWNER_PASSWORD}
    placeholders:
      appUser: ${DB_APP_USER:chat_app}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      username: ${REDIS_USER:chat-app}
      password: ${REDIS_PASSWORD}
      timeout: 500ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}
  mvc:
    problemdetails:
      enabled: true

server:
  shutdown: graceful
  forward-headers-strategy: native
  tomcat:
    max-connections: 5000
    accept-count: 1000

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState

chat:
  message:
    max-length: 2000
  write:
    max-concurrent-per-node: 6
  read-path:
    max-concurrent-per-node: 3
  restore:
    timeout: 5s
    default-item-limit: 50
    max-item-limit: 200
    future-tolerance: 60s
  ingest:
    typing-ttl: 10s
    typing-min-store-interval: 3s
    read-min-store-interval: 1s
  stomp:
    server-heartbeat: 10s
    client-heartbeat: 5s
    max-heartbeat: 10s
    max-connections-per-user-per-node: 5
    message-size-limit: 64KB
    send-buffer-size-limit: 512KB
    send-time-limit: 10s
    time-to-first-message: 10s
    resume-max-events: 200
    resume-max-bytes: 256KB
    resume-max-concurrent: 3
    inbound-concurrency: 64
    drain-window: 10s
    allowed-origins: http://localhost:*,http://127.0.0.1:*
  realtime:
    health-check-interval: 5s
    degraded-poll-interval: 5s
  presence:
    grace: 15s
    node-heartbeat: 5s
    node-lease-ttl: 15s
    sweep-interval: 2s
    reconcile-interval: 60s
  jwt:
    issuer: event-based-chat
    access-ttl: 30m
    clock-skew: 30s
    secret: ${JWT_SECRET}
  refresh-token:
    ttl: 14d
    cleanup-after: 30d
