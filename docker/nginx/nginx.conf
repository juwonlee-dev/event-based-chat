# 앱 인스턴스 앞단(REST + WebSocket). Docker DNS가 app의 모든 인스턴스 IP를 돌려주므로
# --scale로 대수를 바꿔도 설정은 그대로다(resolve로 10초마다 다시 조회).
# 워커마다 worker_connections만큼 연결 구조를 미리 잡으므로 CPU 수(auto)가 아니라 고정 수로 둔다(메모리 128m).
worker_processes 2;
worker_rlimit_nofile 65536;

events {
    worker_connections 16384;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 연결이 오래 유지되는 WebSocket이 많으므로 연결 수가 적은 인스턴스로 보낸다.
    # OSS nginx에는 능동 헬스체크가 없어서, 실패한 인스턴스는 10초 동안 빼는 수동 판정만 한다.
    upstream app {
        zone app 64k;
        least_conn;
        server app:8080 resolve max_fails=1 fail_timeout=10s;
    }

    log_format upstream '$remote_addr "$request" $status upstream=$upstream_addr ${request_time}s';
    access_log /dev/stdout upstream;

    server {
        listen 8000;

        location / {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # 강제 종료된 인스턴스의 IP는 응답(RST)조차 없으므로 연결 대기를 짧게 끊고 다음 인스턴스로 넘긴다.
            proxy_connect_timeout 2s;
            # 서버 heart-beat(10초)보다 넉넉하게 둔다.
            proxy_read_timeout 75s;
            proxy_send_timeout 75s;
            proxy_next_upstream error timeout;

            # 어느 인스턴스가 응답했는지(디버깅·검증용). WebSocket 핸드셰이크 응답에도 붙는다.
            add_header X-Upstream $upstream_addr always;
        }
    }
}
