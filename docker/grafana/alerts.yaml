# SLO 알림 규칙(PLAN 20.1). 지표가 아직 없으면(해당 일이 한 번도 없으면) 정상으로 본다.
apiVersion: 1

groups:
  - orgId: 1
    name: chat-slo
    folder: chat
    interval: 30s
    rules:
      - uid: chat-ingest-p99
        title: "이벤트 수집 p99 > 500ms (5분)"
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "POST /sessions/{id}/events p99가 500ms를 넘었습니다(목표 200ms). 락 대기·커넥션 대기를 확인하세요."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'histogram_quantile(0.99, sum by (le) (rate(http_server_requests_milliseconds_bucket{uri="/sessions/{sessionId}/events",method="POST"}[5m])))'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [500] }

      - uid: chat-delivery-p99
        title: "실시간 전달 p99 > 1s (5분)"
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "발행 → 로컬 전송 p99가 1초를 넘었습니다(목표 300ms). Redis 구독 출력 버퍼·노드 부하를 확인하세요."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'histogram_quantile(0.99, sum by (le) (rate(chat_realtime_delivery_latency_milliseconds_bucket[5m])))'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [1000] }

      - uid: chat-resync-ratio
        title: "resume 중 RESYNC 비율 > 20%"
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "재연결 resume가 상한을 자주 넘습니다(목표 5% 미만). 끊김이 길거나 잦은지 확인하세요."
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'sum(increase(chat_realtime_resume_total{result="resync"}[10m])) / clamp_min(sum(increase(chat_realtime_resume_total[10m])), 1)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.2] }

      - uid: chat-write-rejected
        title: "쓰기 과부하 거절 발생(1분)"
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: "노드 쓰기 허용 수(6)를 넘어 503을 돌려주고 있습니다."
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'sum(increase(chat_write_rejected_total[1m]))'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: chat-hikari-pending
        title: "DB 커넥션 대기 지속(30초)"
        condition: C
        for: 30s
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: "커넥션을 기다리는 요청이 30초 넘게 있습니다. pg_stat_activity의 idle in transaction을 확인하세요."
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'max(hikaricp_connections_pending)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: chat-outbox-age
        title: "outbox 가장 오래된 행 > 60초"
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "스냅샷 요청이 Kafka로 나가지 못하고 있습니다(쓰기·실시간에는 영향 없음, 스냅샷만 지연)."
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'max(chat_outbox_oldest_age_seconds)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [60] }

      - uid: chat-dlt
        title: "스냅샷 요청 DLT 적재"
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "DLT에 쌓인 세션은 관리자 POST /sessions/{id}/snapshots로 다시 만드세요."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'sum(increase(chat_dlt_published_total[5m]))'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: chat-redis-degraded
        title: "Redis 중계 저하 지속(30초)"
        condition: C
        for: 30s
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: "노드 간 실시간 전달이 멈추고 클라이언트가 보충 API 폴링으로 버티는 중입니다."
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'max(chat_realtime_degraded)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
