name: event-based-chat

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      DB_NAME: ${DB_NAME:?}
      DB_OWNER_USER: ${DB_OWNER_USER:?}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?}
      DB_APP_USER: ${DB_APP_USER:?}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_lock_waits=on
      - -c
      - max_connections=100
    shm_size: 256m
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 1g
    logging: *default-logging

  redis:
    image: redis:8.10.2-alpine
    # 비밀번호를 파일에 남기지 않도록 ACL은 기동 인자로 만든다(토큰마다 인자 하나).
    command:
      [
        "redis-server", "/usr/local/etc/redis/redis.conf",
        "--user", "default", "off",
        "--user", "${REDIS_USER:?}", "on", ">${REDIS_PASSWORD:?}",
        "~ws:*", "~pr:*", "~rl:*", "&chat:s:*", "&chat:ctl",
        "-@all", "+@read", "+@write", "+@pubsub", "+@scripting", "+@connection", "-@dangerous", "+ping", "+info",
        "+time",
        "--user", "healthcheck", "on", "nopass", "-@all", "+ping",
      ]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --user healthcheck --pass healthcheck ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    logging: *default-logging

  kafka:
    image: apache/kafka:4.2.2
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    ports:
      - "127.0.0.1:9094:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    mem_limit: 1g
    logging: *default-logging

  app:
    build: .
    environment:
      DB_HOST: postgres
      DB_NAME: ${DB_NAME}
      DB_OWNER_USER: ${DB_OWNER_USER}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD}
      DB_APP_USER: ${DB_APP_USER}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      REDIS_HOST: redis
      REDIS_USER: ${REDIS_USER}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BOOTSTRAP: kafka:9092
      JWT_SECRET: ${JWT_SECRET:?}
      SPRING_PROFILES_ACTIVE: local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    volumes:
      - app-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped
    stop_grace_period: 45s
    mem_limit: 1536m
    cpus: 4
    logging: *default-logging

volumes:
  pg-data:
  kafka-data:
  app-logs:
